name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the jar to the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle build --no-daemon

      - name: Collect the mod jar
        run: |
          mkdir out
          cp $(ls build/libs/*.jar | grep -v -e sources -e dev) out/
          ls -l out

      # Download from the run's Artifacts section (comes as a zip)
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: out/*.jar

      # Or download the plain .jar from the repo's Releases page (no zip)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: out/*.jar
